<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="spaceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4169e1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#191970;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Head with helmet -->
  <circle cx="50" cy="25" r="15" fill="url(#spaceGradient)" stroke="#ffffff" stroke-width="1"/>
  <circle cx="50" cy="25" r="12" fill="none" stroke="#ffffff" stroke-width="1"/>
  <rect x="45" y="20" width="10" height="10" rx="2" fill="none" stroke="#ffffff" stroke-width="1"/>
  <!-- Body -->
  <rect x="40" y="40" width="20" height="30" rx="5" fill="url(#spaceGradient)" stroke="#ffffff" stroke-width="1"/>
  <!-- Arms -->
  <line x1="40" y1="45" x2="25" y2="60" stroke="#4169e1" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="45" x2="75" y2="60" stroke="#4169e1" stroke-width="3" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="45" y1="70" x2="45" y2="85" stroke="#191970" stroke-width="3" stroke-linecap="round"/>
  <line x1="55" y1="70" x2="55" y2="85" stroke="#191970" stroke-width="3" stroke-linecap="round"/>
  <!-- Space details -->
  <circle cx="35" cy="45" r="2" fill="#ffff00"/>
  <circle cx="65" cy="50" r="1.5" fill="#ffff00"/>
  <circle cx="50" cy="75" r="2.5" fill="#ffff00"/>
</svg>