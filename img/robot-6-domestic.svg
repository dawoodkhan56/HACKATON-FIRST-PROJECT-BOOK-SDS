<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="domesticGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffa500;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Head -->
  <circle cx="50" cy="25" r="12" fill="url(#domesticGradient)" stroke="#d38d15" stroke-width="1"/>
  <!-- Body -->
  <rect x="40" y="40" width="20" height="30" rx="5" fill="url(#domesticGradient)" stroke="#d38d15" stroke-width="1"/>
  <!-- Arms -->
  <line x1="40" y1="50" x2="25" y2="60" stroke="#ffd700" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="50" x2="75" y2="60" stroke="#ffd700" stroke-width="3" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="45" y1="70" x2="45" y2="85" stroke="#ffa500" stroke-width="3" stroke-linecap="round"/>
  <line x1="55" y1="70" x2="55" y2="85" stroke="#ffa500" stroke-width="3" stroke-linecap="round"/>
  <!-- Friendly eyes -->
  <circle cx="46" cy="22" r="1.5" fill="#333"/>
  <circle cx="54" cy="22" r="1.5" fill="#333"/>
  <!-- Smile -->
  <path d="M45 28 Q50 32 55 28" stroke="#333" stroke-width="1" fill="none"/>
  <!-- Chest details -->
  <circle cx="50" cy="50" r="4" fill="none" stroke="#d38d15" stroke-width="1"/>
  <rect x="47" y="55" width="6" height="3" rx="1" fill="#d38d15"/>
</svg>