<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="humanoidMainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e6e6fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c5c5e9;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Head -->
  <circle cx="50" cy="25" r="15" fill="url(#humanoidMainGradient)" stroke="#a0a0c0" stroke-width="1"/>
  <!-- Body -->
  <rect x="40" y="40" width="20" height="30" rx="5" fill="url(#humanoidMainGradient)" stroke="#a0a0c0" stroke-width="1"/>
  <!-- Arms -->
  <line x1="40" y1="45" x2="25" y2="60" stroke="#c5c5e9" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="45" x2="75" y2="60" stroke="#c5c5e9" stroke-width="3" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="45" y1="70" x2="45" y2="85" stroke="#a0a0c0" stroke-width="3" stroke-linecap="round"/>
  <line x1="55" y1="70" x2="55" y2="85" stroke="#a0a0c0" stroke-width="3" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="45" cy="22" r="2" fill="#000080"/>
  <circle cx="55" cy="22" r="2" fill="#000080"/>
  <!-- Mouth -->
  <path d="M45 30 Q50 35 55 30" stroke="#800000" stroke-width="1" fill="none"/>
</svg>