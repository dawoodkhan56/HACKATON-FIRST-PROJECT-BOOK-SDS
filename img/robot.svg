<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="simpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a9a9a9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#696969;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Simple robot body -->
  <rect x="35" y="30" width="30" height="40" rx="5" fill="url(#simpleGradient)" stroke="#2f2f2f" stroke-width="1"/>
  <!-- Head -->
  <circle cx="50" cy="20" r="12" fill="url(#simpleGradient)" stroke="#2f2f2f" stroke-width="1"/>
  <!-- Arms -->
  <line x1="35" y1="45" x2="20" y2="60" stroke="#a9a9a9" stroke-width="4" stroke-linecap="round"/>
  <line x1="65" y1="45" x2="80" y2="60" stroke="#a9a9a9" stroke-width="4" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="42" y1="70" x2="42" y2="85" stroke="#696969" stroke-width="4" stroke-linecap="round"/>
  <line x1="58" y1="70" x2="58" y2="85" stroke="#696969" stroke-width="4" stroke-linecap="round"/>
  <!-- Simple face -->
  <circle cx="45" cy="18" r="1.5" fill="#000000"/>
  <circle cx="55" cy="18" r="1.5" fill="#000000"/>
  <path d="M45 25 Q50 28 55 25" stroke="#000000" stroke-width="1" fill="none"/>
</svg>