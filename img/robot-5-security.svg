<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="securityGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4b0000;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Head -->
  <rect x="40" y="20" width="20" height="20" rx="5" fill="url(#securityGradient)" stroke="#600000" stroke-width="1"/>
  <!-- Body -->
  <rect x="35" y="40" width="30" height="30" rx="5" fill="url(#securityGradient)" stroke="#600000" stroke-width="1"/>
  <!-- Arms -->
  <line x1="35" y1="50" x2="20" y2="60" stroke="#8b0000" stroke-width="3" stroke-linecap="round"/>
  <line x1="65" y1="50" x2="80" y2="60" stroke="#8b0000" stroke-width="3" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="42" y1="70" x2="42" y2="85" stroke="#4b0000" stroke-width="3" stroke-linecap="round"/>
  <line x1="58" y1="70" x2="58" y2="85" stroke="#4b0000" stroke-width="3" stroke-linecap="round"/>
  <!-- Security details -->
  <polygon points="50,25 55,30 50,35 45,30" fill="#ffff00"/>
  <rect x="43" y="45" width="14" height="8" rx="2" fill="none" stroke="#ffff00" stroke-width="1"/>
  <!-- Visor -->
  <rect x="42" y="22" width="16" height="6" rx="1" fill="#87ceeb" opacity="0.6"/>
</svg>