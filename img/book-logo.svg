<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4d72aa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c5364;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" fill="url(#logoGradient)" rx="10"/>
  <g filter="url(#glow)">
    <rect x="20" y="20" width="60" height="50" rx="5" fill="none" stroke="white" stroke-width="2"/>
    <path d="M30 25 L30 65" stroke="white" stroke-width="2" stroke-dasharray="2,2"/>
    <path d="M40 30 L60 30" stroke="white" stroke-width="1"/>
    <path d="M40 35 L60 35" stroke="white" stroke-width="1"/>
    <path d="M40 40 L60 40" stroke="white" stroke-width="1"/>
    <path d="M40 45 L60 45" stroke="white" stroke-width="1"/>
    <path d="M40 50 L60 50" stroke="white" stroke-width="1"/>
    <path d="M40 55 L50 55" stroke="white" stroke-width="1"/>
  </g>
  <circle cx="70" cy="30" r="5" fill="#4fc3f7"/>
  <text x="50" y="85" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">AI/SD</text>
</svg>