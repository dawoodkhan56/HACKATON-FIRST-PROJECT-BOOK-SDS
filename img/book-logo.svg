<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3a7bd5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d2ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" fill="url(#logoGradient)" rx="20"/>
  <g filter="url(#glow)">
    <circle cx="50" cy="40" r="15" fill="none" stroke="white" stroke-width="2"/>
    <path d="M40 55 Q50 70 60 55" stroke="white" stroke-width="2" fill="none"/>
    <circle cx="45" cy="38" r="2" fill="white"/>
    <circle cx="55" cy="38" r="2" fill="white"/>
    <path d="M47 45 Q50 47 53 45" stroke="white" stroke-width="1" fill="none"/>
  </g>
</svg>