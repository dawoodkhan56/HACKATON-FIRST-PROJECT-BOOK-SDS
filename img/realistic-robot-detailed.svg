<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="detailedGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3a7bd5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d2ff;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Body -->
    <rect x="40" y="45" width="20" height="40" rx="5" fill="url(#detailedGradient)" stroke="#1a5ca3" stroke-width="1"/>
    <!-- Head -->
    <circle cx="50" cy="35" r="15" fill="url(#detailedGradient)" stroke="#1a5ca3" stroke-width="1"/>
    <!-- Arms -->
    <line x1="40" y1="55" x2="25" y2="65" stroke="#3a7bd5" stroke-width="3" stroke-linecap="round"/>
    <line x1="60" y1="55" x2="75" y2="65" stroke="#3a7bd5" stroke-width="3" stroke-linecap="round"/>
    <!-- Legs -->
    <line x1="44" y1="85" x2="44" y2="95" stroke="#00a2cc" stroke-width="3" stroke-linecap="round"/>
    <line x1="56" y1="85" x2="56" y2="95" stroke="#00a2cc" stroke-width="3" stroke-linecap="round"/>
    <!-- Face details -->
    <circle cx="45" cy="32" r="2" fill="#ffffff"/>
    <circle cx="55" cy="32" r="2" fill="#ffffff"/>
    <circle cx="45" cy="32" r="1" fill="#000080"/>
    <circle cx="55" cy="32" r="1" fill="#000080"/>
    <path d="M45 40 Q50 43 55 40" stroke="#ffffff" stroke-width="1" fill="none"/>
    <!-- Chest display -->
    <rect x="43" y="55" width="14" height="10" rx="2" fill="none" stroke="#ffffff" stroke-width="1"/>
    <circle cx="50" cy="60" r="1" fill="#00ff00"/>
  </g>
</svg>