<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="medicalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f7fa;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Head -->
  <circle cx="50" cy="25" r="15" fill="url(#medicalGradient)" stroke="#b2ebf2" stroke-width="1"/>
  <!-- Body -->
  <rect x="40" y="40" width="20" height="30" rx="5" fill="url(#medicalGradient)" stroke="#b2ebf2" stroke-width="1"/>
  <!-- Arms -->
  <line x1="40" y1="50" x2="25" y2="60" stroke="#b2ebf2" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="50" x2="75" y2="60" stroke="#b2ebf2" stroke-width="3" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="45" y1="70" x2="45" y2="85" stroke="#b2ebf2" stroke-width="3" stroke-linecap="round"/>
  <line x1="55" y1="70" x2="55" y2="85" stroke="#b2ebf2" stroke-width="3" stroke-linecap="round"/>
  <!-- Medical cross -->
  <rect x="45" y="45" width="10" height="10" fill="none" stroke="#ff3d00" stroke-width="1"/>
  <line x1="50" y1="47" x2="50" y2="53" stroke="#ff3d00" stroke-width="2" stroke-linecap="round"/>
  <line x1="47" y1="50" x2="53" y2="50" stroke="#ff3d00" stroke-width="2" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="45" cy="22" r="1.5" fill="#4db6ac"/>
  <circle cx="55" cy="22" r="1.5" fill="#4db6ac"/>
</svg>