<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="industrialGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5d2906;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Robot body -->
  <rect x="30" y="30" width="40" height="50" rx="5" fill="url(#industrialGradient)" stroke="#3e1f04" stroke-width="1"/>
  <!-- Head -->
  <rect x="40" y="20" width="20" height="15" rx="3" fill="#a0522d" stroke="#3e1f04" stroke-width="1"/>
  <!-- Arms -->
  <line x1="30" y1="45" x2="15" y2="60" stroke="#8b4513" stroke-width="3" stroke-linecap="round"/>
  <line x1="70" y1="45" x2="85" y2="60" stroke="#8b4513" stroke-width="3" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="40" y1="80" x2="40" y2="95" stroke="#5d2906" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="80" x2="60" y2="95" stroke="#5d2906" stroke-width="3" stroke-linecap="round"/>
  <!-- Details -->
  <circle cx="45" cy="27" r="1.5" fill="#00ff00"/>
  <circle cx="55" cy="27" r="1.5" fill="#00ff00"/>
  <rect x="42" y="40" width="16" height="8" rx="2" fill="none" stroke="#ffd700" stroke-width="1"/>
</svg>