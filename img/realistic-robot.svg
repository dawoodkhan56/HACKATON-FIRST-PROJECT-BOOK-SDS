<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300">
  <!-- Robot Head -->
  <rect x="85" y="30" width="30" height="30" rx="15" fill="#8a9ba8" />
  <circle cx="95" cy="45" r="3" fill="#2c3e50" />
  <circle cx="105" cy="45" r="3" fill="#2c3e50" />
  <rect x="92" y="50" width="16" height="3" rx="1.5" fill="#2c3e50" />
  
  <!-- Robot Neck -->
  <rect x="97" y="60" width="6" height="10" fill="#7f8c8d" />
  
  <!-- Robot Body -->
  <rect x="70" y="70" width="60" height="100" rx="10" fill="#34495e" />
  <rect x="80" y="80" width="40" height="30" rx="5" fill="#2c3e50" />
  
  <!-- Chest Panel -->
  <rect x="85" y="90" width="30" height="15" rx="7.5" fill="#3498db" />
  <circle cx="100" cy="97.5" r="5" fill="#f1c40f" />
  
  <!-- Arms -->
  <line x1="70" y1="85" x2="40" y2="100" stroke="#2c3e50" stroke-width="10" stroke-linecap="round" />
  <line x1="70" y1="115" x2="40" y2="130" stroke="#2c3e50" stroke-width="10" stroke-linecap="round" />
  <line x1="130" y1="85" x2="160" y2="100" stroke="#2c3e50" stroke-width="10" stroke-linecap="round" />
  <line x1="130" y1="115" x2="160" y2="130" stroke="#2c3e50" stroke-width="10" stroke-linecap="round" />
  
  <!-- Hands -->
  <circle cx="40" cy="100" r="7" fill="#34495e" />
  <circle cx="40" cy="130" r="7" fill="#34495e" />
  <circle cx="160" cy="100" r="7" fill="#34495e" />
  <circle cx="160" cy="130" r="7" fill="#34495e" />
  
  <!-- Waist -->
  <rect x="80" y="170" width="40" height="10" fill="#2c3e50" />
  
  <!-- Legs -->
  <line x1="90" y1="180" x2="90" y2="240" stroke="#2c3e50" stroke-width="12" stroke-linecap="round" />
  <line x1="110" y1="180" x2="110" y2="240" stroke="#2c3e50" stroke-width="12" stroke-linecap="round" />
  
  <!-- Feet -->
  <rect x="80" y="240" width="20" height="10" rx="5" fill="#2c3e50" />
  <rect x="100" y="240" width="20" height="10" rx="5" fill="#2c3e50" />
  
  <!-- Details -->
  <circle cx="100" cy="120" r="8" fill="#e74c3c" />
  <rect x="90" y="135" width="20" height="5" fill="#f39c12" />
</svg>