<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="realisticGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5d8aa8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a5f7a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Body -->
  <rect x="40" y="40" width="20" height="40" rx="5" fill="url(#realisticGradient)" stroke="#2f4f6f" stroke-width="1"/>
  <!-- Head -->
  <ellipse cx="50" cy="30" rx="15" ry="18" fill="url(#realisticGradient)" stroke="#2f4f6f" stroke-width="1"/>
  <!-- Arms -->
  <line x1="40" y1="50" x2="25" y2="60" stroke="#5d8aa8" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="50" x2="75" y2="60" stroke="#5d8aa8" stroke-width="3" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="44" y1="80" x2="44" y2="95" stroke="#3a5f7a" stroke-width="3" stroke-linecap="round"/>
  <line x1="56" y1="80" x2="56" y2="95" stroke="#3a5f7a" stroke-width="3" stroke-linecap="round"/>
  <!-- Details -->
  <circle cx="45" cy="28" r="2" fill="#00ff00"/>
  <circle cx="55" cy="28" r="2" fill="#00ff00"/>
  <rect x="43" y="45" width="14" height="8" rx="2" fill="none" stroke="#ffcc00" stroke-width="1"/>
</svg>